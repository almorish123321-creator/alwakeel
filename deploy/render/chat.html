<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeerFlow - مساعد الذكاء الاصطناعي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;--border:#2a2a2a;--text:#e5e5e5;--text2:#a3a3a3;--accent:#8b5cf6;--accent2:#a78bfa;--user-bubble:#1a1a2e;--ai-bubble:#1e1e1e;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.header h1{font-size:18px;font-weight:600;background:linear-gradient(90deg,#ff80b5,#9089fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-info{display:flex;align-items:center;gap:12px}
.model-badge{font-size:12px;padding:4px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;color:var(--text2)}
.new-chat-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.new-chat-btn:hover{background:var(--surface2);color:var(--text)}

/* Messages */
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:6px}
.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.msg{display:flex;gap:12px;max-width:85%;animation:fadeIn .3s ease}
.msg.user{align-self:flex-start;flex-direction:row-reverse}
.msg.ai{align-self:flex-end}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;font-weight:600}
.msg.user .avatar{background:linear-gradient(135deg,#ff80b5,#9089fc)}
.msg.ai .avatar{background:var(--surface2);border:1px solid var(--border)}

.bubble{padding:12px 16px;border-radius:var(--radius);line-height:1.7;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.user .bubble{background:var(--user-bubble);border:1px solid rgba(139,92,246,.2)}
.msg.ai .bubble{background:var(--ai-bubble);border:1px solid var(--border)}

.bubble p{margin:0 0 8px}
.bubble p:last-child{margin-bottom:0}
.bubble code{background:rgba(139,92,246,.15);padding:2px 6px;border-radius:4px;font-family:'Fira Code',monospace;font-size:13px}
.bubble pre{background:#0d0d0d;border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0}
.bubble pre code{background:none;padding:0}
.bubble ul,.bubble ol{padding-right:20px;margin:8px 0}
.bubble li{margin:4px 0}
.bubble strong{color:var(--accent2)}
.bubble h1,.bubble h2,.bubble h3{margin:12px 0 6px;color:var(--accent2)}

/* Typing indicator */
.typing{display:flex;gap:4px;padding:8px 0}
.typing span{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:bounce 1.4s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(0);opacity:.4}40%{transform:scale(1);opacity:1}}

/* Input */
.input-area{padding:16px 20px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.input-wrap{display:flex;align-items:flex-end;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;transition:border-color .2s}
.input-wrap:focus-within{border-color:var(--accent)}
#chatInput{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;font-family:inherit;resize:none;max-height:150px;line-height:1.5;min-height:24px}
#chatInput::placeholder{color:var(--text2)}
#sendBtn{width:36px;height:36px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
#sendBtn:hover{background:var(--accent2);transform:scale(1.05)}
#sendBtn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* Welcome */
.welcome{text-align:center;padding:40px 20px;color:var(--text2)}
.welcome h2{font-size:24px;margin-bottom:8px;color:var(--text)}
.welcome p{font-size:15px;margin-bottom:24px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.suggestion{padding:8px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;color:var(--text2);cursor:pointer;font-size:13px;transition:all .2s}
.suggestion:hover{background:var(--surface);color:var(--text);border-color:var(--accent)}

/* Error */
.error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:8px 12px;border-radius:8px;font-size:13px;margin-top:4px}

/* Responsive */
@media(max-width:640px){
  .msg{max-width:95%}
  .suggestions{flex-direction:column;align-items:center}
}
</style>
</head>
<body>

<div class="header">
  <h1>DeerFlow</h1>
  <div class="header-info">
    <span class="model-badge">GPT-4o Mini</span>
    <button class="new-chat-btn" onclick="newChat()">محادثة جديدة</button>
  </div>
</div>

<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <h2>مرحباً بك في DeerFlow</h2>
    <p>مساعدك الذكي للبحث والإبداع</p>
    <div class="suggestions">
      <div class="suggestion" onclick="useSuggestion(this)">اكتب لي بحث عن الذكاء الاصطناعي</div>
      <div class="suggestion" onclick="useSuggestion(this)">اشرح لي مفهوم التعلم العميق</div>
      <div class="suggestion" onclick="useSuggestion(this)">أعطني 5 أفكار مشاريع</div>
      <div class="suggestion" onclick="useSuggestion(this)">ساعدني في كتابة مقال</div>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="chatInput" placeholder="اكتب رسالتك هنا..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>

<script>
let threadId = null;
let isStreaming = false;
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function useSuggestion(el) {
  inputEl.value = el.textContent;
  sendMessage();
}

function newChat() {
  threadId = null;
  messagesEl.innerHTML = document.getElementById('welcome') ? '' : '';
  messagesEl.innerHTML = `
    <div class="welcome" id="welcome">
      <h2>مرحباً بك في DeerFlow</h2>
      <p>مساعدك الذكي للبحث والإبداع</p>
      <div class="suggestions">
        <div class="suggestion" onclick="useSuggestion(this)">اكتب لي بحث عن الذكاء الاصطناعي</div>
        <div class="suggestion" onclick="useSuggestion(this)">اشرح لي مفهوم التعلم العميق</div>
        <div class="suggestion" onclick="useSuggestion(this)">أعطني 5 أفكار مشاريع</div>
        <div class="suggestion" onclick="useSuggestion(this)">ساعدني في كتابة مقال</div>
      </div>
    </div>`;
  inputEl.value = '';
  inputEl.focus();
}

function addMessage(role, content) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? 'أنت' : 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatMarkdown(content);

  div.appendChild(avatar);
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function formatMarkdown(text) {
  // Basic markdown rendering
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // Code blocks
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Bold
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // Italic
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // Headers
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // Unordered lists
    .replace(/^[*-] (.+)$/gm, '<li>$1</li>')
    // Ordered lists
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    // Paragraphs (double newlines)
    .replace(/\n\n/g, '</p><p>')
    // Single newlines within paragraphs
    .replace(/\n/g, '<br>');

  // Wrap in paragraph if not starting with a block element
  if (!html.startsWith('<h') && !html.startsWith('<pre') && !html.startsWith('<li')) {
    html = '<p>' + html + '</p>';
  }
  return html;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing-indicator';
  div.innerHTML = '<div class="avatar">AI</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function showError(msg) {
  const div = document.createElement('div');
  div.className = 'error-msg';
  div.textContent = msg;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  setTimeout(() => div.remove(), 8000);
}

function setLoading(loading) {
  isStreaming = loading;
  sendBtn.disabled = loading;
  inputEl.disabled = loading;
  if (loading) {
    sendBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><circle cx="12" cy="12" r="10" stroke-opacity=".3"/><path d="M12 2a10 10 0 0 1 10 10"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/></path></svg>';
  } else {
    sendBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>';
  }
}

async function ensureThread() {
  if (threadId) return;
  try {
    const res = await fetch('/api/threads', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    if (!res.ok) throw new Error('فشل إنشاء المحادثة: ' + res.status);
    const data = await res.json();
    threadId = data.thread_id;
  } catch (e) {
    showError('خطأ في الاتصال: ' + e.message);
    throw e;
  }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isStreaming) return;

  inputEl.value = '';
  autoResize(inputEl);
  addMessage('user', text);
  showTyping();
  setLoading(true);

  try {
    await ensureThread();

    const res = await fetch(`/api/threads/${threadId}/runs/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        input: {
          messages: [{ role: 'user', content: text }]
        },
        stream_mode: ['messages'],
        on_disconnect: 'cancel'
      })
    });

    if (!res.ok) {
      removeTyping();
      const errText = await res.text().catch(() => '');
      showError('خطأ من الخادم (' + res.status + '): ' + errText.substring(0, 200));
      setLoading(false);
      return;
    }

    removeTyping();
    const aiBubble = addMessage('ai', '');
    let fullText = '';

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;

        try {
          const parsed = JSON.parse(data);
          // Handle different SSE event types
          if (parsed.type === 'messages/partial') {
            const chunk = parsed.content || '';
            fullText += chunk;
            aiBubble.innerHTML = formatMarkdown(fullText);
            messagesEl.scrollTop = messagesEl.scrollHeight;
          } else if (parsed.event === 'messages/partial' || parsed.event === 'messages/complete') {
            if (parsed.data?.content) {
              fullText = parsed.data.content;
              aiBubble.innerHTML = formatMarkdown(fullText);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          }
        } catch (e) {
          // Try alternate SSE format - some events might have different structure
          try {
            const parsed = JSON.parse(data);
            if (parsed.content !== undefined) {
              fullText += parsed.content;
              aiBubble.innerHTML = formatMarkdown(fullText);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          } catch(e2) { /* skip unparseable lines */ }
        }
      }
    }

    if (!fullText) {
      aiBubble.innerHTML = '<em style="color:var(--text2)">لم يتم استلام رد. حاول مرة أخرى.</em>';
    }

  } catch (e) {
    removeTyping();
    if (e.name !== 'AbortError') {
      showError('خطأ: ' + e.message);
    }
  } finally {
    setLoading(false);
  }
}

// Focus input on load
inputEl.focus();
</script>
</body>
</html>
