# Minimal DeerFlow config for Render deployment
config_version: 34
log_level: info

models:
  - name: gpt-4o-mini
    display_name: GPT-4o Mini
    use: langchain_openai:ChatOpenAI
    model: gpt-4o-mini
    api_key: $OPENAI_API_KEY
    request_timeout: 600.0
    max_retries: 2
    max_tokens: 4096
    context_window: 128000
    temperature: 0.7
    supports_vision: true

sandbox:
  type: none

memory:
  enabled: false
