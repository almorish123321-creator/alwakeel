[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:redis]
command=redis-server --appendonly yes --daemonize no --maxmemory 32mb --maxmemory-policy allkeys-lru
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
command=sh -c "cd /app/backend && PYTHONPATH=. DEER_FLOW_PROJECT_ROOT=/app DEER_FLOW_HOME=/app/backend/.deer-flow DEER_FLOW_CONFIG_PATH=/app/backend/config.yaml DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json DEER_FLOW_STREAM_BRIDGE_REDIS_URL=redis://127.0.0.1:6379/0 DEER_FLOW_AUTH_DISABLED=1 CI=true /app/backend/.venv/bin/python -m uvicorn app.gateway.app:app --host 127.0.0.1 --port 8001 --workers 1"
autostart=true
autorestart=true
startsecs=15
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
depends_on=gateway
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
